:root{
  --bg:#edf1f5;--surface:#fff;--ink:#0d2236;--muted:#566879;--line:#d3dce6;
  --accent:#1769c8;--accent-ink:#fff;--soft:#e3edf9;
  --ok:#1c8a4b;--okbg:#e0f3e8;--warn:#a86500;--warnbg:#fdf0d6;--bad:#c62d2d;--badbg:#fbe3e3;
  --sp:#b4570a;--spbg:#fde9d6;--panel:#0d2236;--digit:#f2f6fa;
  --f-disp:'Barlow Semi Condensed','Arial Narrow',sans-serif;--f-body:'IBM Plex Sans',system-ui,sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (min-width:99999px){:root{
  --bg:#0a1520;--surface:#122233;--ink:#e6eef6;--muted:#93a6b8;--line:#24384c;
  --accent:#4c9bff;--accent-ink:#06182b;--soft:#15304d;
  --ok:#3cc27a;--okbg:#10321f;--warn:#f0b23e;--warnbg:#3a2c0c;--bad:#ff7a7a;--badbg:#3d1717;
  --sp:#ffa55c;--spbg:#3d2410;--panel:#050b12;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;line-height:1.1;margin:0}
h2{font-size:1.6rem}h3{font-size:1.15rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--panel);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top b{font-family:var(--f-disp);font-size:1.15rem;letter-spacing:.02em}
.top .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:99px;padding:4px 12px;font-size:.8rem;cursor:pointer}
.pill.on{background:#fff;color:var(--panel)}
.demo{background:var(--warnbg);color:var(--warn);font-size:.78rem;padding:6px 16px;text-align:center}
.wrap{max-width:520px;margin:0 auto;padding:16px 14px 96px;display:grid;gap:12px}
.wrap.wide{max-width:1150px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px}
.lbl{font:500 .66rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.big{font:700 2.1rem/1 var(--f-disp);font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sm{font-size:.8rem;color:var(--muted)}
.chip{display:inline-block;font-size:.68rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--accent);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.sp{background:var(--spbg);color:var(--sp)}
.neg{color:var(--bad);font-weight:600}
.btn{border:0;cursor:pointer;font-weight:600;background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:10px;text-align:center}
.btn.ghost{background:var(--soft);color:var(--accent)}

.btn.full{width:100%}
.field{display:grid;gap:3px}
.field label{font-size:.76rem;font-weight:600}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:38px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--soft);border-color:var(--accent)}
input[readonly]{background:var(--bg);color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.two>*,.three>*{min-width:0}
input[type=date]{min-width:0;max-width:100%}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);padding:5px 11px;border-radius:99px;font-size:.78rem;font-weight:500;cursor:pointer}
.chips button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.msg{font-size:.8rem;padding:8px 10px;border-radius:9px}
.msg.ok{background:var(--okbg);color:var(--ok)}.msg.warn{background:var(--warnbg);color:var(--warn)}.msg.bad{background:var(--badbg);color:var(--bad)}.msg.info{background:var(--soft);color:var(--accent)}
.pbar{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.pbar i{display:block;height:100%;background:var(--accent)}
.odo{display:inline-flex;gap:2px;background:var(--panel);padding:4px;border-radius:6px}
.odo span{font:500 1.3rem var(--f-mono);background:linear-gradient(#24405c,#0d1c2c 50%,#24405c);color:var(--digit);width:1.1em;text-align:center;border-radius:2px;line-height:1.45}
.odo span.t{background:linear-gradient(#ffb066,#ff8a1f 50%,#ffb066);color:#1a0d00}
.odo .u{font:500 .7rem var(--f-mono);font-style:normal;color:#c8d4e0;align-self:flex-end;padding:0 4px 3px 2px}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:15}
.nav div{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:520px}
.nav button{border:0;background:none;padding:9px 0 12px;font-size:.72rem;font-weight:600;color:var(--muted);cursor:pointer;display:grid;justify-items:center;gap:2px}
.nav button.on{color:var(--accent)}
.nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.days{display:flex;align-items:center;justify-content:space-between;gap:8px}
.track{position:relative;height:34px;background:var(--surface);border:1px solid var(--line);border-radius:7px;background-image:repeating-linear-gradient(90deg,transparent 0 calc(100%/14 - 1px),var(--line) calc(100%/14 - 1px) calc(100%/14))}
.blk{position:absolute;top:2px;bottom:2px;border-radius:5px;background:var(--accent);color:var(--accent-ink);font-size:.62rem;font-weight:600;padding:2px 4px;overflow:hidden;white-space:nowrap;line-height:1.15}
.blk.me{background:var(--ok);color:#fff}.blk.sp{background:var(--sp);color:#fff}
.blk.blocked{background:repeating-linear-gradient(45deg,var(--line) 0 5px,var(--surface) 5px 10px);color:var(--muted)}
.scale{display:flex;justify-content:space-between;font:500 .6rem var(--f-mono);color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th{text-align:left;font:500 .64rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.hl td{background:var(--warnbg)}
tr.off td{opacity:.5;text-decoration:line-through}
.scroll{overflow-x:auto}
.atabs{display:flex;gap:6px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px;align-items:start}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.wkwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px;padding:0 2px 4px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));gap:6px;min-width:860px}
.wkd{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;display:grid;gap:5px;align-content:start;min-height:120px}
.wkd.hoy{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.wkh{font-weight:600;font-size:.8rem;text-transform:capitalize;display:flex;justify-content:space-between;align-items:baseline;background:none;border:0;padding:2px 2px 4px;color:var(--ink);cursor:pointer;font-family:inherit;text-align:left}

.wkr{border:1px solid var(--line);border-left:4px solid var(--pc,var(--accent));border-radius:6px;padding:4px 6px;font-size:.72rem;line-height:1.3;background:var(--bg)}
.wkr b{font-family:var(--f-mono,monospace);font-size:.72rem}
.wkr .m{display:inline-block;font-weight:600;color:var(--pc,var(--accent))}
.wkr.me{background:var(--okbg)}.wkr.sp{background:var(--spbg)}

.saludo{display:flex;justify-content:space-between;align-items:center;gap:10px}

.rk{position:relative;background:#5d636b;border:2px solid #1c1f23;border-radius:9px;padding:5px 12px;display:grid;gap:3px;flex:none}
.rk div{display:flex;align-items:center;justify-content:space-between;gap:7px}

.rk .sc:nth-of-type(1){left:3px;top:3px}.rk .sc:nth-of-type(2){right:3px;top:3px}.rk .sc:nth-of-type(3){left:3px;bottom:3px}.rk .sc:nth-of-type(4){right:3px;bottom:3px}
.parte{display:flex;gap:8px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.parte button{flex:1;padding:8px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--muted);font:600 .9rem var(--f-body,inherit);cursor:pointer}

.acceso{border:1.5px solid var(--accent);border-radius:12px;padding:10px 12px;background:var(--soft)}
.hecha{display:block;font-size:.68rem;color:var(--muted);font-style:italic;font-weight:400}
.rgt td{vertical-align:top}
.wkv{font-size:.7rem;color:var(--muted);padding:2px}
@media(max-width:700px){.wk{grid-template-columns:1fr;min-width:0}.wkd{min-height:0;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}.wkd .wkh{grid-column:1/-1}.wkd .wkv{grid-column:1/-1}}
.line{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.line:last-child{border:0}
.modal{position:fixed;inset:0;background:rgba(5,12,20,.55);z-index:50;display:grid;place-items:center;padding:14px}
.modal>div{background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:16px;display:grid;gap:10px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--panel);color:#fff;padding:10px 16px;border-radius:10px;font-size:.86rem;z-index:60;max-width:90vw;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.users{display:grid;gap:8px}
.users button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.users button:hover{border-color:var(--accent)}
.logo-top{width:30px;height:30px;filter:brightness(0) invert(1);vertical-align:middle;margin-right:8px}

.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pick{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:0;overflow:hidden;cursor:pointer;text-align:center;display:grid}

.pick b{font:700 1.15rem var(--f-disp)}
.pick small{font-size:.74rem;color:var(--muted)}
.pick.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}

const pad=n=>String(n).padStart(2,'0');

const addDays=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const diasEntre=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

 {fase:2,titulo:'Suelta',lecciones:[

 {fase:3,titulo:'Navegación',lecciones:[

function vAlumno(){
  const u=me(),al=u.id;
  const items=[['inicio','Inicio'],['volar','Volar'],['diario','Diario'],['formacion','Formación'],['ficha','Mi ficha']];
  let h=topBar('Aeroclub · Escuela <span class="badge-al">Alumno</span>');
  h+=`<div class="wrap">`+({inicio:aInicio,volar:aVolar,diario:aDiario,formacion:aFormacion,horas:aHoras,ficha:al=>`<div class="row"><h2>Mi ficha</h2><span class="sm">${esc(U(al).al.matricula||'')}</span></div>`+fichaDatos(al,'alumno')}[S.view]||aInicio)(al)+`</div>`;
  return h+nav(items);
}
function aInicio(al){

  if(faltan(u).length)av.push(['warn','Te faltan datos en tu ficha: '+faltan(u).join(', ')+'.']);

   <h3 style="margin-top:6px">${fLarga(c.fecha).replace(/^./,x=>x.toUpperCase())} · ${c.desde}–${c.hasta}</h3><div class="sm">${A(c.avion).mat} · con <b style="color:var(--ink)">${esc(UN(c.instructor).nombre)}</b></div>
   <div class="msg info" style="margin-top:8px"><b>${+c.leccion?'Lección '+c.leccion+' · '+esc(LEC(c.leccion).t):'Vuelo de práctica'}</b>${LEC(c.leccion).ej.length?'<br>Ejercicios: '+esc(LEC(c.leccion).ej.join(', '))+'.':''}</div>

   <div class="row" style="align-items:end;margin-top:4px"><div class="big ${s<0?'neg':''}">${hmTxt(s)}</div><button class="btn sm ghost" data-act="view" data-v="horas">Ver paquetes</button></div></div>`;
  h+=`<div class="card"><div class="row"><span class="lbl">Mi formación</span><span class="sm">Fase ${f.fase} de 4 · ${esc(f.titulo)}</span></div>
   <div class="row" style="margin-top:4px"><span class="big">${pct(al)}<span style="font-size:1.2rem">%</span></span><span class="sm">${logradas(al)} de ${LECCIONES.length} lecciones</span></div><div class="pbar"><i style="width:${pct(al)}%"></i></div>
   <div class="sm">Siguiente: <b style="color:var(--ink)">L${l.n} · ${esc(l.t)}</b>${tieneSuelta(al)?' · <span class="chip sp">Con suelta en '+A(u.al.suelta.avion).mat+'</span>':''}</div>
   <div class="mini3" style="margin-top:10px"><div><span class="lbl">Doble mando</span><b>${hm(t.dm)}</b></div><div><span class="lbl">Solo</span><b>${hm(t.solo)}</b></div><div><span class="lbl">Tomas</span><b>${t.tomas}</b></div></div></div>`;

function aVolar(al){
  const u=U(al);
  if(!S.f||S.f.kind!=='vuelo'||S.f.al!==al){const c=DB.clases.find(c=>c.alumno===al&&c.fecha===today());const l=c?c.leccion:proxLeccion(al).n;
    S.f={kind:'vuelo',al,avion:c?c.avion:(u.al.suelta?u.al.suelta.avion:(DB.aviones[0]||{}).id),tipo:'dm',instructor:c?c.instructor:u.al.instructor,examinador:'',leccion:l,salida:'Igualada-Òdena',destino:'Igualada-Òdena',hora:'10:00',llegada:'',tomas:'1',clase:c?c.id:null}}
  const f=S.f,a=A(f.avion);
  const tipos=[['dm','Doble mando'],...(tieneSuelta(al,f.avion)?[['solo','Solo supervisado']]:[]),['examen','Examen']];
  if(!tipos.some(x=>x[0]===f.tipo))f.tipo='dm';
  const c=f.clase?DB.clases.find(x=>x.id===f.clase):null;
  let h=`<div class="row"><h2>Anotar vuelo de escuela</h2><span class="chip">${a.mat}</span></div>`;
  if(c)h+=`<div class="msg info">Clase de hoy reservada por <b>${esc(UN(c.instructor).nombre)}</b> · ${c.desde}–${c.hasta} · ${esc(lecTxt(c.leccion))}</div>`;
  h+=`<div class="card" style="display:grid;gap:10px">
   <div class="field"><label>Avión</label><div class="chips">${DB.aviones.map(x=>`<button class="${x.id===+f.avion?'on':''}" data-act="f" data-k="avion" data-v="${x.id}">${x.mat}</button>`).join('')}</div></div>
   <div class="field"><label>Tipo de vuelo</label><div class="chips">${tipos.map(([k,t])=>`<button class="${f.tipo===k?'on':''}" data-act="f" data-k="tipo" data-v="${k}">${t}</button>`).join('')}</div>
   <span class="sm">${tieneSuelta(al,f.avion)?'Tienes la suelta en este avión: los vuelos solos siempre con tu instructor en tierra.':'«Solo supervisado» aparecerá cuando tu instructor te dé la suelta en este avión.'}</span></div>
   ${f.tipo==='examen'?`<div class="field"><label>Examinador</label><input data-f="examinador" value="${esc(f.examinador)}" placeholder="Nombre del examinador"></div>`:''}
   <div class="two"><div class="field"><label>${f.tipo==='solo'?'Instructor en tierra':f.tipo==='examen'?'Instructor que te presenta':'Instructor'}</label><select data-f="instructor">${instructores().map(i=>`<option value="${i.id}" ${i.id===+f.instructor?'selected':''}>${esc(i.nombre)}</option>`).join('')}</select></div>
   <div class="field"><label>Lección</label><select data-f="leccion"><option value="0" ${+f.leccion===0?'selected':''}>Vuelo de práctica (sin lección)</option>${LECCIONES.map(l=>`<option value="${l.n}" ${l.n===+f.leccion?'selected':''}>L${l.n} · ${esc(l.t)}</option>`).join('')}</select></div></div>
   <div class="two"><div class="field"><label>Salida</label><input data-f="salida" value="${esc(f.salida)}"></div><div class="field"><label>Destino</label><input data-f="destino" value="${esc(f.destino)}"></div></div>
   <div class="two"><div class="field"><label>Hora de salida</label><input type="time" data-f="hora" value="${f.hora}"></div><div class="field"><label>Tomas</label><input type="number" min="1" data-f="tomas" value="${esc(f.tomas)}"></div></div>
   <div class="field"><label>Horómetro de salida</label><div>${odo(a.horo,a)}</div><span class="sm">Viene del último vuelo del ${a.mat}.</span></div>
   <div class="field"><label>Horómetro de llegada</label><input data-f="llegada" inputmode="decimal" value="${esc(f.llegada)}" placeholder="ej. ${horoTxt(a.horo+(a.tipo_horometro==='horas_minutos'?50:54),a)}" style="font-family:var(--f-mono)"><span class="sm">${a.tipo_horometro==='horas_minutos'?'Horas, coma y minutos (0 a 59), como en el avión.':'Con coma y la décima, como en el avión.'}</span></div></div>
   <div id="prev">${prevVuelo()}</div>
   <button class="btn full" id="gv" data-act="guardar-vuelo" ${errVuelo().length?'disabled':''}>Guardar vuelo</button>`;
  return h;
}
function odo(min,av){const h=String(Math.floor(min/60)).padStart(5,'0');if(av&&av.tipo_horometro==='horas_minutos'){const mm=pad(min%60);return '<span class="odo">'+h.split('').map(c=>'<span>'+c+'</span>').join('')+'<i class="u">h</i>'+mm.split('').map(c=>'<span class="t">'+c+'</span>').join('')+'<i class="u">min</i></span>'}const d=Math.round((min%60)/6);return '<span class="odo">'+h.split('').map(c=>'<span>'+c+'</span>').join('')+'<span class="t">'+d+'</span></span>'}
function errVuelo(){const f=S.f,a=A(f.avion),e=[],ll=parseHoro(f.llegada,A(f.avion));
  if(ll===null)e.push('Escribe el horómetro de llegada con su décima (ej. '+horoTxt(a.horo+(a.tipo_horometro==='horas_minutos'?50:54),a)+').');else if(ll<=a.horo)e.push('La llegada debe ser mayor que la salida ('+horoTxt(a.horo,a)+').');else if(ll-a.horo>6*60)e.push('Más de 6 h de vuelo: revisa la lectura.');
  if(!(+f.tomas>=1))e.push('Indica el número de tomas.');if(f.tipo==='examen'&&!String(f.examinador).trim())e.push('Indica el examinador.');
  if(U(f.al).al.medico<today())e.push('Tu certificado médico está caducado.');return e}
function prevVuelo(){const f=S.f,a=A(f.avion),ll=parseHoro(f.llegada,A(f.avion)),e=errVuelo();let h='';
  if(ll!==null&&ll>a.horo){const m=ll-a.horo,s=saldo(f.al);h+=`<div class="card" style="background:var(--soft);border-color:transparent"><div class="row"><span class="lbl">Tiempo de vuelo</span><b style="font:700 1.4rem var(--f-disp)">${hmTxt(m)}</b></div>
   <div class="row" style="margin-top:4px"><span class="sm">Mis horas de escuela</span><span>${hmTxt(s)} → <b class="${s-m<0?'neg':''}">${hmTxt(s-m)}</b></span></div></div>`;
   if(s-m<0)h+=`<div class="msg warn">Te quedarás en negativo: se descontará del próximo paquete.</div>`;
   h+=f.tipo==='dm'?`<div class="msg ok">✓ ${esc(UN(f.instructor).nombre)} recibirá este vuelo en su logbook como <b>instructor</b> y te pondrá la nota de la clase.</div>`:f.tipo==='solo'?`<div class="msg ok">✓ Queda registrado con ${esc(UN(f.instructor).nombre)} como instructor en tierra, que te pondrá la nota.</div>`:''}
  if(e.length&&String(f.llegada).trim())h+=`<div class="msg info">${e.map(esc).join('<br>')}</div>`;return h}
function aDiario(al){
  if(S.vsel)return detalleVuelo(S.vsel,false);

  <div class="tl"><div>Doble mando<b>${hm(t.dm)}</b></div><div>Solo superv.<b>${hm(t.solo)}</b></div><div>Examen<b>${t.examen?hm(t.examen):'—'}</b></div><div>Tomas<b>${t.tomas}</b></div></div>
  <div class="card">${vs.map(v=>filaVuelo(v,'alumno')).join('')||'<p class="sm">Todavía no has anotado vuelos.</p>'}</div>
  <div class="msg info">Este es tu diario mientras eres alumno. Cuando apruebes, todos estos vuelos pasarán a tu logbook de piloto con su tipo: doble mando, solo o examen.</div>`;
}
function filaVuelo(v,como){const d=new Date(v.fecha+'T12:00');
  const quien=como==='alumno'?(v.tipo==='examen'?'Examinador '+esc(v.examinador):(v.tipo==='solo'?'Instructor en tierra ':'Instructor ')+esc(UN(v.instructor).nombre)):'Alumno '+esc(UN(v.alumno).nombre);
  const est=v.tipo==='examen'?'':v.nota?`<span class="chip ok" style="margin-left:4px">Nota</span>`:`<span class="chip warn" style="margin-left:4px">Sin nota</span>`;
  return `<button class="fl" data-act="ver-vuelo" data-id="${v.id}"><div class="d">${d.getDate()}<br>${MESES[d.getMonth()].slice(0,3)}</div><div><b>${A(v.avion).mat} · ${esc(lecTxt(v.leccion))}</b> ${typ(v.tipo)}${est}<div class="sm">${quien} · ${v.tomas} toma${+v.tomas===1?'':'s'}</div></div><b>${hm(v.min)}</b></button>`}
function detalleVuelo(id,gestion){
  const v=DB.vuelos.find(x=>x.id===id);if(!v){S.vsel=null;return ''}
  const n=v.nota;
  let h=`<div class="row"><button class="btn sm ghost" data-act="cerrar-vuelo">‹ Volver</button>${typ(v.tipo)}</div>
  <div class="card"><span class="lbl">${fLarga(v.fecha)} · ${v.hora}</span><h3 style="margin-top:4px">${+v.leccion?'Lección '+v.leccion+' · '+esc(LEC(v.leccion).t):'Vuelo de práctica (sin lección)'}</h3>
  <div class="sm" style="margin-top:3px">${A(v.avion).mat} · ${esc(v.salida)} → ${esc(v.destino)} · <b style="color:var(--ink)">${hmTxt(v.min)}</b> · ${v.tomas} toma${+v.tomas===1?'':'s'} · horómetro ${horoTxt(v.horoSal,A(v.avion))} → ${horoTxt(v.horoLle,A(v.avion))}</div>
  <div class="row" style="margin-top:8px;justify-content:flex-start;gap:6px"><span class="who">Alumno: ${esc(UN(v.alumno).nombre)}</span>${v.tipo==='examen'?`<span class="who" style="background:var(--spbg);color:var(--sp)">Examinador: ${esc(v.examinador)}</span>`:`<span class="who" style="background:var(--soft);color:var(--accent)">${v.tipo==='solo'?'Instructor en tierra':'Instructor'}: ${esc(UN(v.instructor).nombre)}</span>`}</div></div>`;
  if(n){h+=`${LEC(v.leccion).ej.length?'':`<div class="msg ok">✓ Revisado por ${esc(UN(n.por).nombre)}.</div>`}<div class="card" style="${LEC(v.leccion).ej.length?'':'display:none'}"><span class="lbl">Nota del instructor</span>${LEC(v.leccion).ej.map((e,i)=>`<div class="ex"><span>${esc(e)}</span><span class="chip ${['','bad','warn','ok','ok'][n.g[i]]||''}">${n.g[i]||'—'} · ${GRADOS[n.g[i]]||''}</span></div>`).join('')}
    <div class="row" style="margin-top:8px"><span class="sm">Resultado de la lección</span>${chipEst(n.res)}</div></div>
    ${n.com?`<div class="card"><span class="lbl">Comentario</span><div class="quote" style="margin-top:6px">${esc(n.com)}</div>${n.prox?`<span class="lbl" style="display:block;margin-top:10px">Para la próxima clase</span><p style="font-size:.88rem;margin-top:3px">${esc(n.prox)}</p>`:''}</div>`:''}`}
  else if(v.tipo==='examen')h+=`<div class="msg info">Vuelo de examen. El resultado lo registra la cuenta Aeroclub al pasar al alumno a piloto.</div>`;
  else h+=gestion?formNota(v):`<div class="msg warn">Tu instructor todavía no ha puesto la nota de esta clase.</div>`;
  return h;
}
function aFormacion(al){

  if(S.ftab==='Teórico')h+=teoricoHTML(al,false);
  else if(S.ftab==='Comentarios'){const cs=DB.comentarios.filter(c=>c.alumno===al).concat(DB.vuelos.filter(v=>v.alumno===al&&v.nota&&v.nota.com).map(v=>({fecha:v.nota.fecha||v.fecha,por:v.nota.por,txt:v.nota.com,lec:v.leccion}))).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
    h+=`<div class="card">${cs.map(c=>`<div class="line" style="display:block"><div class="row"><span class="sm">${fCorta(c.fecha)} · ${esc(UN(c.por).nombre)}${c.lec?' · L'+c.lec:''}</span></div><div style="font-size:.88rem;margin-top:2px">${esc(c.txt)}</div></div>`).join('')||'<p class="sm">Sin comentarios todavía.</p>'}</div>`}
  else{h+=programaHTML(al,false);
    h+=`<div class="card"><span class="lbl">Camino a la licencia</span><div class="flow" style="margin-top:6px"><div class="on">Alumno<br>en formación</div><div class="${DB.vuelos.some(v=>v.alumno===al&&v.tipo==='examen')?'on':''}">Examen<br>AESA</div><div>Piloto<br>logbook y reservas</div></div>
    <p class="sm" style="margin-top:6px">Cuando apruebes, el Aeroclub te pasará a piloto: tendrás tu logbook con todas tus horas de escuela ya anotadas y, si quieres, acceso a las reservas.</p></div>`}
  return h;
}
function programaHTML(al,gestion){
  return PROGRAMA.map(f=>{const n=f.lecciones.filter(([k])=>estadoLec(al,k)==='ok').length;
    return `<div class="card"><div class="ph"><span class="n">FASE ${f.fase}</span><b>${esc(f.titulo)}</b><span class="sm" style="margin-left:auto">${n}/${f.lecciones.length}</span></div><div class="pbar" style="margin-top:0"><i style="width:${n/f.lecciones.length*100}%"></i></div>
    ${f.lecciones.map(([k,t])=>`<div class="line"><span><b style="font-family:var(--f-mono);color:var(--muted);margin-right:6px">${k}</b>${esc(t)}</span>${gestion?`<span class="mk"><button class="${estadoLec(al,k)==='pr'?'pr':''}" data-act="lec" data-al="${al}" data-n="${k}" data-v="pr">En curso</button><button class="${estadoLec(al,k)==='ok'?'ok':''}" data-act="lec" data-al="${al}" data-n="${k}" data-v="ok">Logrado</button></span>`:chipEst(estadoLec(al,k))}</div>`).join('')}</div>`}).join('');

/* ---------- ficha de datos del alumno (obligatoria por normativa) ---------- */
const edad=f=>{if(!f)return null;const n=new Date(f+'T12:00'),h=new Date();let e=h.getFullYear()-n.getFullYear();if(h.getMonth()<n.getMonth()||(h.getMonth()===n.getMonth()&&h.getDate()<n.getDate()))e--;return e};
const CAMPOS=[['nombre','Nombre y apellidos','u'],['dni','DNI / NIE',''],['nacimiento','Fecha de nacimiento','date'],['email','Correo','u'],['telefono','Teléfono',''],['direccion','Dirección',''],['cp','Código postal',''],['poblacion','Población',''],
  ['emergNombre','Contacto de emergencia',''],['emergTel','Teléfono de emergencia',''],['medicoClase','Certificado médico: clase',''],['medicoEmision','Certificado médico: emisión','date'],['medico','Certificado médico: caducidad','date'],['matricula','Nº de matrícula en la escuela',''],['curso','Curso',''],['inicio','Fecha de inicio','date']];
const ALUMNO_EDITA=['telefono','direccion','cp','poblacion','emergNombre','emergTel','medicoClase','medicoEmision','medico'];
function valCampo(u,k){return ['nombre','email'].includes(k)?u[k]:u.al[k]}
function faltan(u){return CAMPOS.filter(([k])=>!String(valCampo(u,k)||'').trim()).map(x=>x[1])}
function fichaDatos(al,modo){/* modo: 'alumno' | 'ver' | 'editar' */
  const u=U(al),a=u.al,e=edad(a.nacimiento),dm=diasEntre(today(),a.medico),fl=faltan(u),ed=S.edit===al;
  const val=(k,t)=>{const v=valCampo(u,k);return t==='date'?fNum(v):esc(v)};
  const editable=k=>ed&&(modo==='editar'||(modo==='alumno'&&ALUMNO_EDITA.includes(k)));
  const fila=([k,l,t])=>`<div class="dato"><span class="sm">${l.replace('Certificado médico: ','').replace(/^./,x=>x.toUpperCase())}</span>${editable(k)?`<input data-d="${k}" ${t==='date'?'type="date"':''} value="${esc(valCampo(u,k)||'')}">`:`<b>${val(k,t)||'<span class="neg">Falta</span>'}</b>`}</div>`;
  const grupo=(t,ks)=>`<div class="card"><span class="lbl">${t}</span><div class="datos">${CAMPOS.filter(c=>ks.includes(c[0])).map(fila).join('')}</div></div>`;
  let h='';
  if(fl.length)h+=`<div class="msg bad">⛔ Faltan datos obligatorios: ${esc(fl.join(', '))}.</div>`;
  if(dm<0)h+=`<div class="msg bad">⛔ Certificado médico caducado desde el ${fNum(a.medico)}. No puede volar.</div>`;else if(dm<=60)h+=`<div class="msg warn">⚠ El certificado médico caduca en ${dm} días (${fNum(a.medico)}).</div>`;else h+=`<div class="msg ok">✓ Certificado médico en vigor hasta el ${fNum(a.medico)}.</div>`;
  if(e!=null&&e<16)h+=`<div class="msg bad">⛔ Tiene ${e} años: para ser alumno piloto hacen falta 16.</div>`;else if(e!=null&&e<18)h+=`<div class="msg info">Menor de edad (${e} años): conviene guardar la autorización de padre, madre o tutor.</div>`;
  h+=grupo('Datos personales',['nombre','dni','nacimiento','email','telefono'])+grupo('Dirección',['direccion','cp','poblacion'])+grupo('Contacto de emergencia',['emergNombre','emergTel'])+grupo('Certificado médico',['medicoClase','medicoEmision','medico'])+grupo('Escuela',['matricula','curso','inicio']);
  h+=`<div class="card"><span class="lbl">Instructor y suelta</span><div class="datos"><div class="dato"><span class="sm">Instructor</span><b>${esc(UN(a.instructor).nombre)}</b></div><div class="dato"><span class="sm">Suelta</span><b>${a.suelta?A(a.suelta.avion).mat+' desde '+fNum(a.suelta.desde):'No'}</b></div>${e!=null?`<div class="dato"><span class="sm">Edad</span><b>${e} años</b></div>`:''}</div></div>`;
  if(modo==='alumno'||modo==='editar')h+=ed?`<div class="two"><button class="btn ghost" data-act="cancelar-edit">Cancelar</button><button class="btn" data-act="guardar-ficha" data-al="${al}">Guardar cambios</button></div>${modo==='alumno'?'<p class="sm">Nombre, DNI, fecha de nacimiento y correo solo los cambia el Aeroclub.</p>':''}`
    :`<button class="btn ghost full" data-act="editar-ficha" data-al="${al}">${modo==='alumno'?'Actualizar mis datos de contacto o el médico':'Editar la ficha'}</button>`;
  else h+=`<p class="sm">Solo lectura.</p>`;
  h+=`<button class="btn ghost full" data-act="copiar-ficha" data-al="${al}">Copiar la ficha (para imprimir o archivar)</button>`;
  return h;
}

function lunes(s){const d=new Date(s+'T12:00'),w=(d.getDay()+6)%7;return addDays(s,-w)}
function iPlanning(){

  ${esPrincipal()?`<div class="chips"><button class="${ver==='todos'?'on':''}" data-act="pins" data-v="todos">Todos</button>${instructores().map(i=>`<button class="${+ver===i.id?'on':''}" data-act="pins" data-v="${i.id}">${esc(nombre1(i.nombre))}</button>`).join('')}</div>`:''}

  return h+`</div><p class="sm">Las clases ocupan el avión en el calendario del club. Para cancelar una clase, ve a «Clases reservadas».</p><button class="btn sm ghost" data-act="view" data-v="clases">Clases reservadas (cancelar)</button>`;

function render(){
  const u=me();let h=demoBar();
  if(!u)h+=vLogin();
  else if(u.rol==='alumno'&&ES_ALUMNO)h+=vAlumno();
  else if(u.rol==='principal'||ES_PRINCIPAL)h+=vPrincipal();
  else if(u.instructor)h+=vInstructor();
  else h+='<p class="cargando">No tienes acceso a la escuela.</p>';
  if(u&&S.view==='inicio'&&!S.sel&&!S.vsel)h+=`<img class="wmk" src="${LOGO}" alt="">`;
  if(S.modal)h+=`<div class="modal" data-act="fondo"><div data-stop="1">${{clase:modalClase,alta:modalAlta,instructores:modalInstructores,pasar:modalPasar,prefs:modalPrefs,salir:modalSalir}[S.modal.kind]()}</div></div>`;
  if(S.toast)h+=`<div class="toast">${esc(S.toast)}</div>`;
  document.body.dataset.tema=palEsc();
  const y=window.scrollY,app=document.getElementById('app');app.innerHTML=h;
  if(render.keep)window.scrollTo(0,y);render.keep=false;
}
