<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reservas · Aeroclub</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d2236">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AeroClub">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Share+Tech+Mono&display=swap">
<style>
:root{
  --bg:#edf1f5;--surface:#fff;--ink:#0d2236;--muted:#566879;--line:#d3dce6;
  --accent:#1769c8;--accent-ink:#fff;--soft:#e3edf9;
  --ok:#1c8a4b;--okbg:#e0f3e8;--warn:#a86500;--warnbg:#fdf0d6;--bad:#c62d2d;--badbg:#fbe3e3;
  --sp:#b4570a;--spbg:#fde9d6;--panel:#0d2236;--digit:#f2f6fa;
  --f-disp:'Barlow Semi Condensed','Arial Narrow',sans-serif;--f-body:'IBM Plex Sans',system-ui,sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0a1520;--surface:#122233;--ink:#e6eef6;--muted:#93a6b8;--line:#24384c;
  --accent:#4c9bff;--accent-ink:#06182b;--soft:#15304d;
  --ok:#3cc27a;--okbg:#10321f;--warn:#f0b23e;--warnbg:#3a2c0c;--bad:#ff7a7a;--badbg:#3d1717;
  --sp:#ffa55c;--spbg:#3d2410;--panel:#050b12;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;line-height:1.1;margin:0}
h2{font-size:1.6rem}h3{font-size:1.15rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--panel);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top b{font-family:var(--f-disp);font-size:1.15rem;letter-spacing:.02em}
.top .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:99px;padding:4px 12px;font-size:.8rem;cursor:pointer}
.pill.on{background:#fff;color:var(--panel)}
.demo{background:var(--warnbg);color:var(--warn);font-size:.78rem;padding:6px 16px;text-align:center}
.wrap{max-width:520px;margin:0 auto;padding:16px 14px 96px;display:grid;gap:12px}
.wrap.wide{max-width:1150px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px}
.lbl{font:500 .66rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.big{font:700 2.1rem/1 var(--f-disp);font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sm{font-size:.8rem;color:var(--muted)}
.chip{display:inline-block;font-size:.68rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--accent);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.sp{background:var(--spbg);color:var(--sp)}
.neg{color:var(--bad);font-weight:600}
.btn{border:0;cursor:pointer;font-weight:600;background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:10px;text-align:center}
.btn.ghost{background:var(--soft);color:var(--accent)}
.btn.danger{background:var(--badbg);color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:.8rem;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.full{width:100%}
.field{display:grid;gap:3px}
.field label{font-size:.76rem;font-weight:600}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:38px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--soft);border-color:var(--accent)}
input[readonly]{background:var(--bg);color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.two>*,.three>*{min-width:0}
input[type=date]{min-width:0;max-width:100%}
.trsel{cursor:pointer}.trsel.on td{background:var(--soft)}@media(max-width:600px){.vercol{display:none}}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:600px){.three.st1{grid-template-columns:1fr}.three.st2{grid-template-columns:1fr 1fr}.three.st2>:last-child{grid-column:1/-1}.three.st3{grid-template-columns:1fr 1fr}.three.st3>:first-child{grid-column:1/-1}}
#ficha-sel{scroll-margin-top:100px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);padding:5px 11px;border-radius:99px;font-size:.78rem;font-weight:500;cursor:pointer}
.chips button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.msg{font-size:.8rem;padding:8px 10px;border-radius:9px}
.msg.ok{background:var(--okbg);color:var(--ok)}.msg.warn{background:var(--warnbg);color:var(--warn)}.msg.bad{background:var(--badbg);color:var(--bad)}.msg.info{background:var(--soft);color:var(--accent)}
.pbar{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.pbar i{display:block;height:100%;background:var(--accent)}
.odo{display:inline-flex;gap:2px;background:var(--panel);padding:4px;border-radius:6px}
.odo span{font:500 1.3rem var(--f-mono);background:linear-gradient(#24405c,#0d1c2c 50%,#24405c);color:var(--digit);width:1.1em;text-align:center;border-radius:2px;line-height:1.45}
.odo span.t{background:linear-gradient(#ffb066,#ff8a1f 50%,#ffb066);color:#1a0d00}
.odo .u{font:500 .7rem var(--f-mono);font-style:normal;color:#c8d4e0;align-self:flex-end;padding:0 4px 3px 2px}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:15}
.nav div{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:520px}
.nav button{border:0;background:none;padding:9px 0 12px;font-size:.72rem;font-weight:600;color:var(--muted);cursor:pointer;display:grid;justify-items:center;gap:2px}
.nav button.on{color:var(--accent)}
.nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.days{display:flex;align-items:center;justify-content:space-between;gap:8px}
.track{position:relative;height:34px;background:var(--surface);border:1px solid var(--line);border-radius:7px;background-image:repeating-linear-gradient(90deg,transparent 0 calc(100%/14 - 1px),var(--line) calc(100%/14 - 1px) calc(100%/14))}
.blk{position:absolute;top:2px;bottom:2px;border-radius:5px;background:var(--accent);color:var(--accent-ink);font-size:.62rem;font-weight:600;padding:2px 4px;overflow:hidden;white-space:nowrap;line-height:1.15}
.blk.me{background:var(--ok);color:#fff}.blk.sp{background:var(--sp);color:#fff}
.blk.blocked{background:repeating-linear-gradient(45deg,var(--line) 0 5px,var(--surface) 5px 10px);color:var(--muted)}
.scale{display:flex;justify-content:space-between;font:500 .6rem var(--f-mono);color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th{text-align:left;font:500 .64rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.hl td{background:var(--warnbg)}
tr.off td{opacity:.5;text-decoration:line-through}
.scroll{overflow-x:auto}
.atabs{display:flex;gap:6px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px;align-items:start}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.wkwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px;padding:0 2px 4px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));gap:6px;min-width:860px}
.wkd{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;display:grid;gap:5px;align-content:start;min-height:120px}
.wkd.hoy{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.wkh{font-weight:600;font-size:.8rem;text-transform:capitalize;display:flex;justify-content:space-between;align-items:baseline;background:none;border:0;padding:2px 2px 4px;color:var(--ink);cursor:pointer;font-family:inherit;text-align:left}
.wkh span{text-transform:none;font-weight:400;font-size:.7rem;color:var(--muted)}
.wkr{border:1px solid var(--line);border-left:4px solid var(--pc,var(--accent));border-radius:6px;padding:4px 6px;font-size:.72rem;line-height:1.3;background:var(--bg)}
.wkr b{font-family:var(--f-mono,monospace);font-size:.72rem}
.wkr .m{display:inline-block;font-weight:600;color:var(--pc,var(--accent))}
.wkr.me{background:var(--okbg)}.wkr.sp{background:var(--spbg)}
.wkr.blocked{background:repeating-linear-gradient(45deg,var(--line) 0 5px,var(--surface) 5px 10px);color:var(--muted)}
.saludo{display:flex;justify-content:space-between;align-items:center;gap:10px}
.saludo>div:first-child{min-width:0}
.saludo h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk{position:relative;background:#5d636b;border:2px solid #1c1f23;border-radius:9px;padding:5px 12px;display:grid;gap:3px;flex:none}
.rk div{display:flex;align-items:center;justify-content:space-between;gap:7px}
.rk i{font:700 14px var(--f-disp);color:#f1f3f5;letter-spacing:.08em;font-style:normal}
.rk b{font:19px 'Share Tech Mono',ui-monospace,monospace;color:#39c8ff;font-weight:400;background:#081118;border-radius:4px;padding:0 6px;line-height:1.25}
.rk .sc{position:absolute;width:5px;height:5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#b9c0c7,#4a5058 72%);box-shadow:inset 0 0 0 1px #15181b}
.rk .sc:nth-of-type(1){left:3px;top:3px}.rk .sc:nth-of-type(2){right:3px;top:3px}.rk .sc:nth-of-type(3){left:3px;bottom:3px}.rk .sc:nth-of-type(4){right:3px;bottom:3px}
.parte{display:flex;gap:8px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.parte button{flex:1;padding:8px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--muted);font:600 .9rem var(--f-body,inherit);cursor:pointer}
.parte button.on{background:var(--soft);border-color:var(--accent);color:var(--accent);cursor:default}
.acceso{border:1.5px solid var(--accent);border-radius:12px;padding:10px 12px;background:var(--soft)}
.hecha{display:block;font-size:.68rem;color:var(--muted);font-style:italic;font-weight:400}
.rgt td{vertical-align:top}
.wkv{font-size:.7rem;color:var(--muted);padding:2px}
@media(max-width:700px){.wk{grid-template-columns:1fr;min-width:0}.wkd{min-height:0;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}.wkd .wkh{grid-column:1/-1}.wkd .wkv{grid-column:1/-1}}
.line{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.line:last-child{border:0}
.modal{position:fixed;inset:0;background:rgba(5,12,20,.55);z-index:50;display:grid;place-items:center;padding:14px}
.modal>div{background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:16px;display:grid;gap:10px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--panel);color:#fff;padding:10px 16px;border-radius:10px;font-size:.86rem;z-index:60;max-width:90vw;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.users{display:grid;gap:8px}
.users button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.users button:hover{border-color:var(--accent)}
.logo-top{width:30px;height:30px;filter:brightness(0) invert(1);vertical-align:middle;margin-right:8px}
.logo-big{width:150px;height:150px;margin:0 auto}
@media (prefers-color-scheme:dark){.logo-big{filter:brightness(0) invert(1)}}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pick{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:0;overflow:hidden;cursor:pointer;text-align:center;display:grid}
.pick img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--bg)}
.pick span{padding:7px 6px 9px;display:grid;gap:1px}
.pick b{font:700 1.15rem var(--f-disp)}
.pick small{font-size:.74rem;color:var(--muted)}
.pick.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.pick.on b{color:var(--accent)}
.pick:disabled{cursor:default;opacity:.6}
.pick i{font-style:normal;font-size:.66rem;font-weight:600;margin-top:3px}
textarea{min-height:70px}
</style>
</head>

const SCHEMA_SQL="-- =====================================================================\n-- App de reservas del aeroclub \u00b7 Modelo de datos \u00b7 Fase 1\n-- Base de datos: MariaDB / MySQL (hosting cdmon, plan Junior o superior)\n-- Versi\u00f3n 0.1 \u00b7 12 de noviembre de 2026\n--\n-- Reglas de base:\n--   * Todos los tiempos (hor\u00f3metro, bonos, saldos) se guardan en MINUTOS ENTEROS.\n--     D\u00e9cimas: 1 d\u00e9cima = 6 min.  1284,6 h -> 1284*60 + 6*6 = 77076 min.\n--   * El saldo de cada socio es la suma de sus movimientos (libro de movimientos).\n--     Nunca se guarda un saldo \"a mano\": se calcula.\n--   * Los vuelos no se borran: se anulan, y cada cambio queda en el historial.\n--   * El hor\u00f3metro actual es el \u00faltimo evento del avi\u00f3n: llegada de vuelo o calibraci\u00f3n.\n-- =====================================================================\n\nSET NAMES utf8mb4;\n\n-- ---------------------------------------------------------------------\n-- Usuarios: socios y administradores (un administrador tambi\u00e9n es socio)\n-- ---------------------------------------------------------------------\nCREATE TABLE usuarios (\n  id                 INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,\n  nombre             VARCHAR(80)  NOT NULL,\n  apellidos          VARCHAR(120) NOT NULL DEFAULT '',\n  email              VARCHAR(190) NOT NULL UNIQUE,\n  password_hash      VARCHAR(255) NULL,              -- NULL hasta que acepta la invitaci\u00f3n\n  rol                VARCHAR(20)  NOT NULL DEFAULT 'socio',  -- 'socio' | 'admin' (preparado para m\u00e1s roles)\n  es_safety_pilot    TINYINT(1)   NOT NULL DEFAULT 0,\n  recencia_meses     TINYINT UNSIGNED NULL,          -- exige safety pilot si no ha volado en N meses (3, 6) \u00b7 NULL = sin restricci\u00f3n\n  idioma             CHAR(2)      NOT NULL DEFAULT 'ca',     -- 'ca' | 'es'\n  licencia_caduca    DATE         NULL,              -- NULL = sin licencia (alumno)\n  medico_caduca      DATE         NULL,              -- certificado m\u00e9dico\n  activo             TINYINT(1)   NOT NULL DEFAULT 1,      -- 0 = dado de baja (se conserva su historial)\n  invitacion_token   CHAR(64)     NULL UNIQUE,       -- enlace de un solo uso\n  invitacion_caduca  DATETIME     NULL,\n  ultimo_acceso      DATETIME     NULL,\n  creado_en          DATETIME     NOT NULL DEFAULT CURRENT_TIMESTAMP\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;\n\n-- ---------------------------------------------------------------------\n-- Aviones\n-- ---------------------------------------------------------------------\nCREATE TABLE aviones (\n  id                       INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,\n  matricula                VARCHAR(12)  NOT NULL UNIQUE,\n  modelo                   VARCHAR(80)  NOT NULL,     -- 'ICP Savannah S', 'ELA 07'...\n  clase                    VARCHAR(20)  NOT NULL DEFAULT 'Avi\u00f3n', -- 'Avi\u00f3n' | 'Autogiro'\n  foto                     MEDIUMTEXT   NULL,         -- foto para el selector de avi\u00f3n (ruta o imagen)\n  tipo_horometro           VARCHAR(20)  NOT NULL,     -- 'decimas' | 'horas_minutos'\n  horometro_inicial_min    INT UNSIGNED NOT NULL,     -- lectura al dar de alta el avi\u00f3n en la app\n  proxima_revision_min     INT UNSIGNED NULL,         -- por horas\n  proxima_revision_fecha   DATE         NULL,         -- o por fecha\n  activo                   TINYINT(1)   NOT NULL DEFAULT 1,  -- 0 = dado de baja (se conserva su historial)\n  creado_en                DATETIME     NOT NULL DEFAULT CURRENT_TIMESTAMP\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;\n-- El hor\u00f3metro actual = llegada del \u00faltimo vuelo v\u00e1lido (o el inicial si no hay vuelos).\n\n-- ---------------------------------------------------------------------\n-- En qu\u00e9 aviones vuela suelto cada socio (si no est\u00e1 aqu\u00ed, necesita safety pilot)\n-- ---------------------------------------------------------------------\nCREATE TABLE usuario_avion_suelto (\n  usuario_id   INT UNSIGNED NOT NULL,\n  avion_id     INT UNSIGNED NOT NULL,\n  desde        DATE NULL,\n  PRIMARY KEY (usuario_id, avion_id),\n  FOREIGN KEY (usuario_id) REFERENCES usuarios(id),\n  FOREIGN KEY (avion_id)   REFERENCES aviones(id)\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;\n\n-- ---------------------------------------------------------------------\n-- Reservas\n-- ---------------------------------------------------------------------\nCREATE TABLE reservas (\n  id                INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,\n  avion_id          INT UNSIGNED NOT NULL,\n  usuario_id        INT UNSIGNED NOT NULL,          -- piloto que reserva\n  safety_pilot_id   INT UNSIGNED NULL,\n  sp_estado         VARCHAR(12)  NULL,              -- 'pendiente' | 'aceptado' | 'rechazado'\n  inicio            DATETIME     NOT NULL,\n  fin               DATETIME     NOT NULL,\n  estado            VARCHAR(12)  NOT NULL DEFAULT 'activa',  -- 'activa' | 'cancelada'\n  nota              VARCHAR(255) NULL,\n  creado_en         DATETIME     NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  creado_por        INT UNSIGNED NOT NULL,\n  FOREIGN KEY (avion_id)        REFERENCES aviones(id),\n  FOREIGN KEY (usuario_id)      REFERENCES usuarios(id),\n  FOREIGN KEY (safety_pilot_id) REFERENCES usuarios(id),\n  INDEX idx_reserva_avion_fecha (avion_id, inicio, fin)\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;\n\n-- ---------------------------------------------------------------------\n-- Bloqueos de avi\u00f3n en el calendario (revisi\u00f3n, aver\u00eda, defecto \"no volar\")\n-- ---------------------------------------------------------------------\nCREATE TABLE bloqueos (\n  id          INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,\n  avion_id    INT UNSIGNED NOT NULL,\n  inicio      DATETIME     NOT NULL,\n  fin         DATETIME     NULL,                   -- NULL = hasta nuevo aviso\n  motivo      VARCHAR(255) NOT NULL,\n  creado_por  INT UNSIGNED NOT NULL,\n  creado_en   DATETIME     NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  FOREIGN KEY (avion_id)   REFERENCES aviones(id),\n  FOREIGN KEY (creado_por) REFERENCES usuarios(id)\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;\n\n-- ---------------------------------------------------------------------\n-- Vuelos (el logbook)\n-- ---------------------------------------------------------------------\nCREATE TABLE vuelos (\n  id                     INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,\n  avion_id               INT UNSIGNED NOT NULL,\n  reserva_id             INT UNSIGNED NULL,\n  piloto_id              INT UNSIGNED NOT NULL,\n  safety_pilot_id        INT UNSIGNED NULL,       -- solo informativo: no suma horas ni gasta bono\n  tipo                   VARCHAR(16)  NOT NULL,   -- 'normal' | 'escuela' | 'divulgacion' | 'mantenimiento'\n  fecha                  DATE         NOT NULL,\n  aerodromo_salida       VARCHAR(80)  NOT NULL,\n  aerodromo_destino      VARCHAR(80)  NOT NULL,\n  hora_salida            TIME         NOT NULL,\n  hora_llegada           TIME         NOT NULL,   -- calculada: salida + minutos\n  horometro_salida_min   INT UNSIGNED NOT NULL,\n  horometro_llegada_min  INT UNSIGNED NOT NULL,\n  minutos                INT AS (CAST(horometro_llegada_min AS SIGNED) - CAST(horometro_salida_min AS SIGNED)) STORED,\n  acompanante            TINYINT(1)   NOT NULL,   -- obligatorio, informativo\n  tomas                  TINYINT UNSIGNED NOT NULL, -- obligatorio, informativo\n  descuenta_bono         TINYINT(1)   NOT NULL,   -- 1 solo en 'normal'; 0 en escuela, divulgaci\u00f3n y mantenimiento\n  -- 'escuela' y 'mantenimiento' solo los crea un administrador (creado_por = admin, piloto_id = quien vuela)\n  salida_editada         TINYINT(1)   NOT NULL DEFAULT 0, -- la salida no coincid\u00eda con la llegada anterior\n  nota_piloto            VARCHAR(500) NULL,       -- obligatoria si salida_editada = 1\n  estado                 VARCHAR(12)  NOT NULL DEFAULT 'ok', -- 'ok' | 'por_revisar' | 'anulado'\n  creado_en              DATETIME     NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  creado_por             INT UNSIGNED NOT NULL,\n  FOREIGN KEY (avion_id)        REFERENCES aviones(id),\n  FOREIGN KEY (reserva_id)      REFERENCES reservas(id),\n  FOREIGN KEY (piloto_id)       REFERENCES usuarios(id),\n  FOREIGN KEY (safety_pilot_id) REFERENCES usuarios(id),\n  CHECK (horometro_llegada_min > horometro_salida_min),\n  INDEX idx_vuelo_avion (avion_id, horometro_llegada_min),\n  INDEX idx_vuelo_piloto (piloto_id, fecha)\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;\n\n-- ---------------------------------------------------------------------\n-- Calibraciones del hor\u00f3metro (solo administradores)\n-- Si el hor\u00f3metro de la app no coincide con el del avi\u00f3n, el administrador\n-- escribe la lectura real; los vuelos siguientes salen de ese valor.\n-- ---------------------------------------------------------------------\nCREATE TABLE calibraciones (\n  id             INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,\n  avion_id       INT UNSIGNED NOT NULL,\n  anterior_min   INT UNSIGNED NOT NULL,             -- lo que dec\u00eda la app\n  nuevo_min      INT UNSIGNED NOT NULL,             -- lectura real del avi\u00f3n\n  piloto_id      INT UNSIGNED NULL,                 -- a nombre de qui\u00e9n queda (p. ej. el \u00faltimo que vol\u00f3)\n  descuenta_bono TINYINT(1)   NOT NULL DEFAULT 0,   -- si la diferencia se descuenta del bono de ese piloto\n  motivo         VARCHAR(255) NULL,                 -- opcional\n  usuario_id     INT UNSIGNED NOT NULL,             -- administrador que calibra\n  creado_en      DATETIME     NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  FOREIGN KEY (avion_id)   REFERENCES aviones(id),\n  FOREIGN KEY (piloto_id)  REFERENCES usuarios(id),\n  FOREIGN KEY (usuario_id) REFERENCES usuarios(id)\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;\n\n-- ---------------------------------------------------------------------\n-- Bonos de horas comprados por cada socio\n-- ---------------------------------------------------------------------\nCREATE TABLE bonos (\n  id           INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,\n  usuario_id   INT UNSIGNED NOT NULL,\n  minutos      INT UNSIGNED NOT NULL,              -- bonos de 5 h (300) o 10 h (600)\n  fecha        DATE         NOT NULL,              -- define el orden: se gasta primero el m\u00e1s antiguo\n  nota         VARCHAR(255) NULL,\n  creado_por   INT UNSIGNED NOT NULL,\n  creado_en    DATETIME     NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  FOREIGN KEY (usuario_id) REFERENCES usuarios(id),\n  FOREIGN KEY (creado_por) REFERENCES usuarios(id)\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;\n\n-- ---------------------------------------------------------------------\n-- Libro de movimientos de saldo: saldo del socio = SUM(minutos)\n--   bono   -> +minutos del bono\n--   vuelo  -> -minutos del vuelo (solo si descuenta_bono)\n--   ajuste -> +/- con motivo obligatorio (solo administradores)\n-- Si se corrige o anula un vuelo, su movimiento se actualiza y queda en el historial.\n-- ---------------------------------------------------------------------\nCREATE TABLE movimientos (\n  id           INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,\n  usuario_id   INT UNSIGNED NOT NULL,\n  tipo         VARCHAR(8)   NOT NULL,              -- 'bono' | 'vuelo' | 'ajuste'\n  minutos      INT          NOT NULL,              -- con signo\n  bono_id      INT UNSIGNED NULL,\n  vuelo_id     INT UNSIGNED NULL UNIQUE,\n  motivo       VARCHAR(255) NULL,\n  fecha        DATETIME     NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  creado_por   INT UNSIGNED NOT NULL,\n  FOREIGN KEY (usuario_id) REFERENCES usuarios(id),\n  FOREIGN KEY (bono_id)    REFERENCES bonos(id),\n  FOREIGN KEY (vuelo_id)   REFERENCES vuelos(id),\n  INDEX idx_mov_usuario (usuario_id, fecha)\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;\n\n-- ---------------------------------------------------------------------\n-- Historial de cambios (qui\u00e9n, cu\u00e1ndo, qu\u00e9 y por qu\u00e9)\n-- ---------------------------------------------------------------------\nCREATE TABLE historial (\n  id           BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,\n  tabla        VARCHAR(30)  NOT NULL,              -- 'vuelos', 'bonos', 'movimientos', 'usuarios'...\n  registro_id  INT UNSIGNED NOT NULL,\n  accion       VARCHAR(40)  NOT NULL,              -- 'Creado' | 'Editado' | 'Anulado' | 'Revisado'...\n  cambios      JSON         NULL,                  -- {\"campo\": [\"antes\", \"despu\u00e9s\"]}\n  motivo       VARCHAR(255) NULL,\n  usuario_id   INT UNSIGNED NOT NULL,\n  fecha        DATETIME     NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  FOREIGN KEY (usuario_id) REFERENCES usuarios(id),\n  INDEX idx_hist_registro (tabla, registro_id)\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;\n\n-- ---------------------------------------------------------------------\n-- Vistas \u00fatiles\n-- ---------------------------------------------------------------------\nCREATE VIEW v_saldos AS\n  SELECT u.id AS usuario_id, u.nombre, u.apellidos,\n         COALESCE(SUM(m.minutos), 0) AS saldo_min\n  FROM usuarios u LEFT JOIN movimientos m ON m.usuario_id = u.id\n  GROUP BY u.id;\n\n-- Hor\u00f3metro actual = el \u00faltimo evento registrado del avi\u00f3n: llegada de un vuelo v\u00e1lido o calibraci\u00f3n.\nCREATE VIEW v_horometro_actual AS\n  SELECT a.id AS avion_id, a.matricula,\n         COALESCE((SELECT e.valor FROM (\n                     SELECT avion_id, horometro_llegada_min AS valor, creado_en FROM vuelos WHERE estado <> 'anulado'\n                     UNION ALL\n                     SELECT avion_id, nuevo_min, creado_en FROM calibraciones) e\n                   WHERE e.avion_id = a.id ORDER BY e.creado_en DESC LIMIT 1),\n                  a.horometro_inicial_min) AS horometro_min\n  FROM aviones a;\n\n-- Fase 2 (m\u00e1s adelante): documentos, mantenimiento, avisos_defecto, sincronizaci\u00f3n con Google Calendar.\n";
/* Horómetro en una sola casilla: décimas «1286,2» · horas y minutos «1472,20» (coma o punto) */
function parseHoro(av,t){t=String(t||'').trim();const m=t.match(/^(\d+)(?:[.,](\d{1,2}))?$/);if(!m)return null;const h=+m[1];
  if(av.tipo_horometro==='decimas'){if(m[2]&&m[2].length>1)return null;return h*60+(m[2]?+m[2]*6:0)}
  const mi=m[2]?+m[2]:0;if(mi>59)return null;return h*60+mi}
function horoInput(av,min){return av.tipo_horometro==='decimas'?fmtHoro(av,min):Math.floor(min/60)+','+pad(min%60)}

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const ahora=()=>{const d=new Date();return ymd(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const addDays=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return ymd(d)};
const hm2min=s=>{const [h,m]=s.split(':').map(Number);return h*60+m};
const min2hm=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fmtDia=s=>{const d=new Date(s+'T12:00');return DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()]};
const fmtCorto=s=>{const d=new Date(s+'T12:00');return d.getDate()+' '+MESES[d.getMonth()].slice(0,3)};
function fmtMin(m){const neg=m<0;m=Math.abs(m);const h=Math.floor(m/60),r=m%60;const t=h?(h+' h'+(r?' '+pad(r)+' min':'')):(r+' min');return (neg?'−':'')+t}
function fmtHoro(av,min){
  if(av.tipo_horometro==='decimas'){const h=Math.floor(min/60),dec=Math.round((min%60)/6);return h+','+dec}
  return Math.floor(min/60).toLocaleString('es-ES')+' h '+pad(min%60)+' min';
}
function odo(av,min){
  if(av.tipo_horometro==='decimas'){const h=String(Math.floor(min/60)).padStart(5,'0');const d=Math.round((min%60)/6);return '<span class="odo" aria-label="Horómetro '+fmtHoro(av,min)+'">'+h.split('').map(c=>'<span>'+c+'</span>').join('')+'<span class="t">'+d+'</span></span>'}
  const h=String(Math.floor(min/60)).padStart(5,'0'),m=pad(min%60);
  return '<span class="odo" aria-label="Horómetro '+fmtHoro(av,min)+'">'+h.split('').map(c=>'<span>'+c+'</span>').join('')+'<i class="u">h</i>'+m.split('').map(c=>'<span class="t">'+c+'</span>').join('')+'<i class="u">min</i></span>';
}
function picker(sel,u,disabled,lista){
  const l=lista||(u!=null?avionesPara(u):avionesActivos());if(sel!=null&&!l.some(a=>a.id===sel)&&A(sel))l.push(A(sel));
  if(!l.length)return '<div class="msg warn">No tienes ningún avión asignado. Habla con un administrador.</div>';
  return `<div class="picker" role="radiogroup" aria-label="Avión">${l.map(a=>`<button class="pick ${a.id===sel?'on':''}" role="radio" aria-checked="${a.id===sel}" data-act="pick-avion" data-id="${a.id}" ${disabled?'disabled':''}>
   ${fotoDe(a)?`<img src="${fotoDe(a)}" alt="${esc(a.modelo)} ${esc(a.matricula)}">`:'<span style="aspect-ratio:4/3;display:grid;place-items:center;background:var(--bg);color:var(--muted)">Sin foto</span>'}
   <span><b>${esc(a.matricula)}</b><small>${esc(a.modelo)} · ${esc(a.clase||'')}</small>${u?`<i style="color:${!necesitaSP(u,a.id)?'var(--ok)':'var(--sp)'}">${!necesitaSP(u,a.id)?'Vuelas suelto':'Con safety pilot'}</i>`:''}</span></button>`).join('')}</div>`;
}

function save(){
  if(!API)return Promise.resolve({ok:false});
  const adm=esAdminCuenta();
  if(adm){DB.aviones.forEach(a=>{a.horo_actual=horoCalc(a.id)});DB.usuarios.forEach(u=>{const f=ultimoVuelo(u.id);if(f)u.ultimo_vuelo_ms=Date.parse(f+'T12:00:00')})}
  const ops=[];
  const diff=(col,items,idOf)=>{const old=raw(col),seen=new Set();
    items.forEach(it=>{const id=String(idOf(it));seen.add(id);const d=limpio(JSON.parse(JSON.stringify(it)));const o=old.get(id);if(!o||ser(o)!==ser(d))ops.push({op:'set',col,id,data:d})});

    listen:(c,f,cb,err)=>{
      if(f&&f.docId)return Fs.onSnapshot(Fs.doc(db,c,f.docId),s=>cb(s.exists()?[{id:s.id,data:s.data()}]:[]),err);
      const cs=[];if(f&&f.field)cs.push(Fs.where(f.field,f.op||'==',f.value));if(f&&f.order)cs.push(Fs.orderBy(f.order,'desc'));if(f&&f.limit)cs.push(Fs.limit(f.limit));const ref=cs.length?Fs.query(Fs.collection(db,c),...cs):Fs.collection(db,c);
      return Fs.onSnapshot(ref,s=>cb(s.docs.map(d=>({id:d.id,data:d.data()}))),err)},
    commit:async ops=>{for(let i=0;i<ops.length;i+=400){const w=Fs.writeBatch(db);ops.slice(i,i+400).forEach(o=>o.op==='delete'?w.delete(Fs.doc(db,o.col,o.id)):w.set(Fs.doc(db,o.col,o.id),o.data));await w.commit()}},
    crearCuenta:async email=>{const sec=A_.initializeApp(FIREBASE_CONFIG,'alta'+Date.now()),sa=Au.getAuth(sec);let estado='creada';
      try{await Au.createUserWithEmailAndPassword(sa,email,crypto.randomUUID()+'Aa1!')}catch(e){if(e.code==='auth/email-already-in-use')estado='existia';else throw e}

}

  const cobrar=p=>{if(deuda>0&&p.quedan>0){const g=Math.min(p.quedan,deuda);p.quedan-=g;deuda-=g}};
  for(const e of ev){
    if(e.t==='bono'){const b=e.b,p={id:b.id,b,mant:esMant(b),cad:caducaDe(b),desde:b.fecha,quedan:b.minutos,perdido:0};cobrar(p);pools.push(p);mov.push({fecha:b.fecha,orden:'0',txt:(b.nota||'Paquete')+(p.mant?' (mantenimiento '+temporadaDe(b)+')':''),min:b.minutos,tipo:'bono'})}
    else if(e.t==='abono'){const p={id:'aj'+e.a.id,mant:false,desde:e.fecha,quedan:e.min,perdido:0};cobrar(p);pools.push(p);mov.push({fecha:e.fecha,orden:'1',txt:e.txt,min:e.min,tipo:'ajuste'})}
    else if(e.t==='gasto'){let g=e.min;
      const act=pools.filter(p=>p.quedan>0&&p.desde<=e.fecha&&(!p.mant||p.cad>=e.fecha)).sort((x,y)=>(y.mant-x.mant)||(x.mant?x.cad.localeCompare(y.cad):x.desde.localeCompare(y.desde)));
      for(const p of act){if(g<=0)break;const q=Math.min(p.quedan,g);p.quedan-=q;g-=q}
      deuda+=g;mov.push({fecha:e.fecha,orden:e.orden,txt:e.txt,min:-e.min,tipo:e.tipo})}
    else if(e.t==='cad'){const p=pools.find(x=>x.id===e.b.id);if(p&&p.quedan>0){mov.push({fecha:p.cad,orden:'9',txt:'Caducidad paquete mantenimiento '+temporadaDe(p.b),min:-p.quedan,tipo:'caducidad'});p.perdido=p.quedan;p.quedan=0}if(p)p.caducado=true}
  }
  return {mov,pools,deuda};
}
const movimientos=(uid,aid)=>cuentaHoras(uid,aid).mov.slice().sort((a,b)=>(a.fecha+a.orden).localeCompare(b.fecha+b.orden));
const saldo=(uid,aid)=>cuentaHoras(uid,aid).mov.reduce((s,m)=>s+m.min,0);

function bonosFIFO(uid,aid){const c=cuentaHoras(uid,aid);return DB.bonos.filter(b=>b.usuario_id===uid&&(aid==null||avDe(b)===aid)).sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(b=>{const p=c.pools.find(x=>x.id===b.id)||{};return {...b,quedan:p.quedan??b.minutos,mant:esMant(b),caduca:caducaDe(b),caducado:!!p.caducado,perdido:p.perdido||0}})}
const mantVigente=(uid,aid)=>DB.bonos.some(b=>b.usuario_id===uid&&avDe(b)===aid&&esMant(b)&&b.fecha<=today()&&caducaDe(b)>=today());

function cadenaRota(v){ // la salida no coincide con la llegada del vuelo anterior del mismo avión
  const ev=eventosHoro(v.avion_id);let lo=0,hi=ev.length;while(lo<hi){const m=(lo+hi)>>1;if(ev[m].id<v.id)lo=m+1;else hi=m}
  const prev=lo?ev[lo-1]:null;
  const esperado=prev?prev.valor:A(v.avion_id).horometro_inicial_min;
  return v.horometro_salida_min!==esperado?v.horometro_salida_min-esperado:0;
}

function diasHasta(f){return Math.round((new Date(f+'T12:00')-new Date(today()+'T12:00'))/864e5)}
function avisosDe(u){
  const a=[];
  if(u.reservas!==false)avionesPara(u.id).forEach(av=>{const s=saldo(u.id,av.id);
    if(s<=0)a.push(['bad',av.matricula+': '+(s<0?'saldo en negativo ('+fmtMin(s)+')':'sin saldo')+'. No puedes reservarlo hasta comprar un paquete.']);
    else if(s<120)a.push(['warn',av.matricula+': te quedan '+fmtMin(s)+'. Piensa en comprar otro paquete.'])});
  [['Licencia de piloto',u.licencia_caduca],['Certificado médico',u.medico_caduca]].forEach(([n,f])=>{
    if(!f)return;const dd=diasHasta(f);
    if(dd<0)a.push(['bad',n+' caducado desde el '+fmtCorto(f)+'. Renuévalo antes de volar.']);
    else if(dd<=60)a.push(['warn',n+' caduca el '+fmtCorto(f)+' (en '+dd+' días).']);
  });
  const now=today()+'T00:00';
  reservasActivas().filter(r=>r.usuario_id===u.id&&r.sp_estado==='rechazado'&&r.inicio>=now).forEach(r=>a.push(['warn','Tu safety pilot no puede el '+fmtCorto(r.inicio.slice(0,10))+'. Elige otro en «Mis reservas».']));
  return a;
}
function mantLicencia(uid){
  const desde=addDays(today(),-MANT_DIAS+1);
  const vs=DB.vuelos.filter(v=>v.piloto_id===uid&&v.estado!=='anulado'&&v.fecha>=desde&&v.fecha<=today()).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const min=vs.reduce((t,v)=>t+minutosVuelo(v),0);
  if(min>=MANT_MIN){let acc=0,f=null;for(const v of vs){acc+=minutosVuelo(v);if(acc>=MANT_MIN){f=v.fecha;break}}
    const hasta=addDays(f,MANT_DIAS-1);
    return `<div class="card" style="border-color:var(--ok);background:var(--okbg)"><div class="row"><b style="color:var(--ok)">✓ Mantenimiento de licencia: al día</b><span class="chip ok">${fmtMin(min)}</span></div><div class="sm" style="margin-top:4px">Has volado ${fmtMin(min)} en las últimas 8 semanas (mínimo orientativo: 1 h). Sigues al día hasta el ${fmtDia(hasta)} si no vuelas antes.</div></div>`}
  return `<div class="card" style="border-color:var(--bad);background:var(--badbg)"><div class="row"><b style="color:var(--bad)">⚠ Mantenimiento de licencia</b><span class="chip bad">${fmtMin(min)} de 1 h</span></div><div class="sm" style="margin-top:4px;color:var(--ink)">Debes volar ${fmtMin(MANT_MIN-min)} más para cumplir el requisito orientativo de renovación: 1 h de vuelo cada 8 semanas.</div></div>`;
}
function grafica6(uid){
  const meses=[];const t=new Date(today()+'T12:00');
  for(let i=5;i>=0;i--){const d=new Date(t.getFullYear(),t.getMonth()-i,1);meses.push({k:d.getFullYear()+'-'+pad(d.getMonth()+1),txt:MESES[d.getMonth()].slice(0,3),min:0,n:0})}
  DB.vuelos.filter(v=>v.piloto_id===uid&&v.estado!=='anulado').forEach(v=>{const m=meses.find(x=>x.k===v.fecha.slice(0,7));if(m){m.min+=minutosVuelo(v);m.n++}});
  const tot=meses.reduce((s,m)=>s+m.min,0),nv=meses.reduce((s,m)=>s+m.n,0);
  const W=320,Hh=140,top=18,base=Hh-22,maxH=Math.max(120,Math.ceil(Math.max(...meses.map(m=>m.min))/60)*60);
  const L=26,bw=30,gap=(W-L-6*bw)/6;
  const ticks=[0,maxH/2,maxH];
  let svg=`<svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="Horas voladas por mes en los últimos 6 meses">`;
  ticks.forEach(v=>{const y=base-(v/maxH)*(base-top);svg+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;if(v)svg+=`<text x="0" y="${y+3}" font-size="9" fill="var(--muted)" font-family="var(--f-mono)">${String(v/60).replace('.',',')} h</text>`});
  meses.forEach((m,i)=>{const x=L+gap/2+i*(bw+gap),hgt=(m.min/maxH)*(base-top),y=base-hgt,last=i===5;
    if(m.min>0){const r=Math.min(4,hgt);svg+=`<path class="bar" d="M${x},${base} V${y+r} Q${x},${y} ${x+r},${y} H${x+bw-r} Q${x+bw},${y} ${x+bw},${y+r} V${base} Z" fill="var(--accent)" opacity="${last?1:.75}"><title>${m.txt}: ${fmtMin(m.min)} en ${m.n} vuelo${m.n===1?'':'s'}</title></path>`;}
    svg+=`<rect x="${x-gap/2}" y="${top}" width="${bw+gap}" height="${base-top}" fill="transparent" data-tip="${m.txt}: ${m.min?fmtMin(m.min)+' en '+m.n+' vuelo'+(m.n===1?'':'s'):'sin vuelos'}"><title>${m.txt}: ${m.min?fmtMin(m.min):'sin vuelos'}</title></rect>`;
    svg+=`<text x="${x+bw/2}" y="${Hh-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${m.txt}</text>`;
    if(last&&m.min)svg+=`<text x="${x+bw/2}" y="${y-4}" text-anchor="middle" font-size="10" font-weight="600" fill="var(--ink)">${fmtMin(m.min)}</text>`;
  });
  svg+=`</svg>`;
  return `<div class="card"><div class="row"><span class="lbl">Lo volado · últimos 6 meses</span><span class="sm">${fmtMin(tot)} · ${nv} vuelo${nv===1?'':'s'}</span></div><div style="margin-top:8px">${svg}</div><div class="sm" id="tip" style="min-height:1.2em">Toca una barra para ver el mes.</div></div>`;
}
const RK_D=['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'],RK_M=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
function rkVals(){const d=new Date(),p=n=>String(n).padStart(2,'0');return {lt:p(d.getHours())+':'+p(d.getMinutes()),ut:p(d.getUTCHours())+':'+p(d.getUTCMinutes())+'Z'}}
function relojATC(){const v=rkVals();

setInterval(()=>{if(!document.querySelector('.rk-lt'))return;const v=rkVals();document.querySelectorAll('.rk-lt').forEach(x=>x.textContent=v.lt);document.querySelectorAll('.rk-ut').forEach(x=>x.textContent=v.ut)},5000);

/* Calendario */
const DIAS_C=['dom','lun','mar','mié','jue','vie','sáb'];
const PCOL=['#1769c8','#7a3fc4','#0e8a7e','#c2410c','#a3366b','#5b6b00'];
function vSemana(admin){
  const ini=S.wk||today(),u=me(),aa=admin?avionesActivos():avionesPara(u.id),col=id=>PCOL[Math.max(0,aa.findIndex(a=>a.id===id))%PCOL.length];
  const fin=addDays(ini,6),dd=s=>{const d=new Date(s+'T12:00');return d.getDate()+' '+MESES[d.getMonth()].slice(0,3)};
  let h=`<div class="days"><button class="btn sm ghost" data-act="wk" data-v="-1">‹</button><b>${dd(ini)} – ${dd(fin)}</b><span style="display:flex;gap:6px">${ini!==today()?'<button class="btn sm ghost" data-act="wkhoy">Hoy</button>':''}<button class="btn sm ghost" data-act="wk" data-v="1">›</button></span></div>`;
  h+=`<div class="sm" style="display:flex;flex-wrap:wrap;gap:4px 12px">${aa.map(a=>`<span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${col(a.id)};vertical-align:-1px"></span> ${a.matricula}</span>`).join('')}</div>${admin?'':'<div class="sm">Verde: mis reservas · Naranja: voy de SP · Toca un día para verlo en detalle</div>'}`;
  h+='<div class="wkwrap"><div class="wk">';
  for(let i=0;i<7;i++){
    const d=addDays(ini,i),dt=new Date(d+'T12:00');
    const veo=r=>admin||aa.some(a=>a.id===r.avion_id)||r.usuario_id===u.id||r.safety_pilot_id===u.id;
    const rs=reservasActivas().filter(r=>r.inicio.slice(0,10)===d&&veo(r)).sort((a,b)=>a.inicio.localeCompare(b.inicio));
    const bs=DB.bloqueos.filter(b=>b.inicio.slice(0,10)<=d&&b.fin.slice(0,10)>=d&&(admin||aa.some(a=>a.id===b.avion_id)));
    h+=`<div class="wkd ${d===today()?'hoy':''}"><button class="wkh" data-act="wkdia" data-v="${d}">${DIAS_C[dt.getDay()]} ${dt.getDate()}<span>${rs.length?rs.length+' res.':''}</span></button>`;
    h+=bs.map(b=>`<div class="wkr blocked" style="--pc:${col(b.avion_id)}"><span class="m">${A(b.avion_id).matricula}</span> bloqueado<br>${esc(b.motivo)}</div>`).join('');
    h+=rs.map(r=>{const c=admin?'':r.usuario_id===u.id?'me':r.safety_pilot_id===u.id?'sp':'';
      const edit=(r.usuario_id===u.id||isAdmin())&&r.fin>=today()+'T00:00';
      return `<div class="wkr ${c}" style="--pc:${col(r.avion_id)}${edit?';cursor:pointer':''}" ${edit?`data-act="editar-reserva" data-id="${r.id}" title="Modificar"`:''}><b>${r.inicio.slice(11)}–${r.fin.slice(11)}</b> <span class="m">${A(r.avion_id).matricula}</span><br>${esc(quienRes(r))}${r.safety_pilot_id?`<br><span class="sm">SP ${esc(nombre(r.safety_pilot_id))}${r.sp_estado!=='aceptado'?' ('+r.sp_estado+')':''}</span>`:''}${hechaTxt(r)}</div>`}).join('');
    if(!rs.length&&!bs.length)h+='<div class="wkv">Libre</div>';
    h+='</div>';
  }
  return h+'</div></div>';
}

function formReserva(){

function leerVuelo(){
  const f=S.form,a=A(+f.avion),esperado=horoActual(a.id);
  let sal=esperado;
  if(f.editSalida)sal=parseHoro(a,f.salidaTxt);
  const lleg=parseHoro(a,f.llegada);
  const errs=[];
  if(sal===null)errs.push('Escribe bien el horómetro de salida.');
  if(lleg===null)errs.push(a.tipo_horometro==='decimas'?'Escribe el horómetro de llegada con su décima (ej. 1286,2).':'Escribe el horómetro de llegada: horas, coma y minutos de 0 a 59 (ej. 1472,20).');
  let min=null;
  if(sal!==null&&lleg!==null){min=lleg-sal;if(min<=0)errs.push('La llegada debe ser mayor que la salida.');else if(min>8*60)errs.push('Más de 8 h de vuelo: revisa la lectura.')}
  if(f.editSalida&&sal!==null&&sal===esperado)errs.push('La salida que has escrito sí coincide: vuelve a la automática.');
  if(f.editSalida&&!String(f.nota).trim())errs.push('Falta la nota para el administrador.');
  if(!f.sp&&!f.acomp)errs.push('Indica si volabas solo o con 2 personas a bordo.');
  if(!(+f.tomas>=1))errs.push('Indica el número de tomas.');
  if(!f.hora)errs.push('Indica la hora de salida.');
  if(f.tipo!=='escuela'&&necesitaSP(+f.piloto,a.id)&&!f.sp)errs.push('Este vuelo necesita safety pilot: indica con quién se voló.');
  if(f.tipo==='escuela'&&!f.sp)errs.push('Indica el instructor del vuelo de escuela.');
  if(SOLO_ADMIN.includes(f.tipo)&&!(S.modo==='admin'&&isAdmin()))errs.push('Este tipo de vuelo solo lo anota un administrador.');
  if(!String(f.salida).trim()||!String(f.destino).trim())errs.push('Indica los aeródromos.');
  return {a,esperado,sal,lleg,min,errs};
}
function prevVuelo(){
  const el=document.getElementById('prev');if(!el)return;
  const {a,esperado,sal,min,errs}=leerVuelo(),f=S.form,pid=+f.piloto,s=saldo(pid,a.id),quien=(pid===S.user?'Mi saldo':'Saldo de '+nombre(pid))+' en el '+a.matricula;

  show('illeg',f.llegada);show('isal',f.salidaTxt);
  const hll=document.getElementById('hll');if(hll)hll.value=(min>0&&f.hora)?min2hm(hm2min(f.hora)+min):'—';
  let h='';

    h+=`<div class="card" style="background:var(--soft);border-color:transparent"><div class="row"><span class="lbl">Tiempo de vuelo</span><b style="font:700 1.4rem var(--f-disp)">${fmtMin(min)}</b></div>
    <div class="row" style="margin-top:4px"><span class="sm">${esc(quien)}</span><span>${desc?`${fmtMin(s)} → <b class="${s-min<0?'neg':''}">${fmtMin(s-min)}</b>`:'No se descuenta ('+TIPO_TXT[f.tipo].toLowerCase()+')'}</span></div></div>`;
    if(desc&&s-min<0)h+=`<div class="msg warn">Con este vuelo el saldo queda en negativo. Se permite y se avisa al administrador.</div>`;

function sqlDump(){

  const ins=(t,cols,rows)=>rows.length?`INSERT INTO ${t} (${cols.join(', ')}) VALUES\n`+rows.map(r=>'  ('+r.map(q).join(', ')+')').join(',\n')+';\n\n':'';
  const dt=x=>x?x.replace('T',' ')+(x.length<=16?':00':''):null;
  let o=`-- Datos de la app de reservas del aeroclub\n-- Exportado el ${ahora()}\n-- Ejecutar DESPUÉS de schema.sql, sobre una base de datos vacía.\n\nSET NAMES utf8mb4;\nSET FOREIGN_KEY_CHECKS = 0;\nSTART TRANSACTION;\n\n`;
  o+=ins('usuarios',['id','nombre','apellidos','email','rol','es_safety_pilot','recencia_meses','idioma','licencia_caduca','medico_caduca','activo'],DB.usuarios.map(u=>[u.id,u.nombre,'',u.email,u.rol,!!u.sp,u.recencia_meses||null,u.idioma||'ca',u.licencia_caduca||null,u.medico_caduca||null,u.activo!==false]));
  o+=ins('aviones',['id','matricula','modelo','clase','tipo_horometro','horometro_inicial_min','proxima_revision_min','activo'],DB.aviones.map(a=>[a.id,a.matricula,a.modelo,a.clase||'Avión',a.tipo_horometro,a.horometro_inicial_min,a.proxima_revision_min||null,a.activo!==false]));
  o+=ins('usuario_avion_suelto',['usuario_id','avion_id'],DB.suelto.map(x=>[x[0],x[1]]));
  o+=ins('reservas',['id','avion_id','usuario_id','safety_pilot_id','sp_estado','inicio','fin','estado','creado_por'],DB.reservas.map(r=>[r.id,r.avion_id,r.usuario_id,r.safety_pilot_id,r.sp_estado,dt(r.inicio),dt(r.fin),r.estado,r.usuario_id]));

  if(t.dataset.dlsel){S[t.dataset.dlsel]=+t.value}
  if(t.dataset.rf){(S.rf||(S.rf={cat:'',por:'',d1:'',d2:''}))[t.dataset.rf]=t.value;S.rlim=200;render()}
  if(t.dataset.p&&S.perfil){S.perfil[t.dataset.p]=t.value;if(t.type==='date')render()}
  if(t.dataset.filtropil!==undefined){S.filtro=t.value?'pil'+t.value:'todos';S.lbN=0;render()}
  if(t.dataset.doc){const u=U(+t.dataset.id);u[t.dataset.doc]=t.value||null;save();toast('Fecha guardada')}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.f&&S.form&&S.form.kind==='vuelo'&&t.tagName!=='SELECT'){S.form[t.dataset.f]=t.value;prevVuelo()}
  if(t.dataset.buscar!==undefined){S.buscar=t.value;const q=t.value.toLowerCase();document.querySelectorAll('tr[data-q]').forEach(r=>{r.style.display=!q||r.dataset.q.includes(q)?'':'none'})}
  if(t.dataset.m&&S.modal){S.modal[t.dataset.m]=t.value}
  if(t.dataset.l){(S.login||(S.login={}))[t.dataset.l]=t.value}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.l&&S.estado==='login'){(S.login||(S.login={}))[e.target.dataset.l]=e.target.value;(S.config===null?act.bootstrap:act.entrar)()}});
S.estado='arranque';render();arrancar();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
