/* ---------- combos y búsqueda tolerante ---------- */
const nz=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const STOP=new Set(['aerodromo','aeropuerto','aero','airport','de','del','la','el','los','las','y','d','l']);
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=[];for(let j=0;j<=n;j++)p[j]=j;for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function tri(s){s='  '+s+' ';const r=new Set();for(let i=0;i<s.length-2;i++)r.add(s.slice(i,i+3));return r}
function dice(a,b){const A=tri(a),B=tri(b);let i=0;A.forEach(x=>{if(B.has(x))i++});return 2*i/((A.size+B.size)||1)}
function prep(a){a._c=nz(a.v);a._t=nz(a.n+' '+(a.sn||'')).split(' ').filter(w=>!STOP.has(w)).join(' ');a._pm=nz(a.m);a._w=a._t.split(' ').filter(Boolean);return a}
function scoreAero(a,q,toks){
 if(a._c===q)return 100;if(a._c.startsWith(q))return 92;
 if(a._t.startsWith(q))return 88;if(a._t.includes(' '+q))return 80;if(a._t.includes(q))return 70;
 if(a._pm.includes(q))return 55;
 let tot=0;
 for(const k of toks){let best=0;
  for(const w of a._w){if(w.startsWith(k)){best=1;break}
   if(k.length>=3){const dd=Math.min(lev(k,w),lev(k,w.slice(0,k.length+1)));const lim=k.length<=4?1:k.length<=7?2:3;if(dd<=lim)best=Math.max(best,.85-dd*.12)}}
  if(!best){const dc=dice(toks.join(''),a._t.replace(/ /g,''));return dc>=.4?Math.round(dc*45):0}
  tot+=best}
 return 40+Math.round(tot/toks.length*25)}
let _all=null;
function baseAeros(){if(!_all)_all=[prep({v:'ZZZZ',n:'Lugar no especificado',m:'fuera de aeródromo o no está en la lista',sn:'ZZZZ'})].concat(AERO.map(a=>{const sn=shortN(a[1]);const m=(a[2]||'')+(a[3]&&a[3]!==a[2]?(a[2]?', ':'')+a[3]:'');return prep({v:a[0]||sn,n:a[1],m,sn})}));return _all}
function aeroFind(qraw,favs,custom,limit){
 const seen=new Set(baseAeros().map(a=>a.v));const all=baseAeros().concat((custom||[]).filter(c=>!seen.has(c.code)).map(c=>prep({v:c.code,n:c.name||'',m:'añadido por ti'})));
 const fav=new Set(favs||[]);const q=nz(qraw);const toks=q.split(' ').filter(w=>w&&!STOP.has(w));
 let r;
 if(!toks.length){r=all.filter(a=>fav.has(a.v));if(!qraw.trim())r=r.concat(all.filter(a=>!fav.has(a.v)&&a.v.length===4&&a.v.startsWith('LE')).slice(0,40))}
 else{const qq=toks.join(' ');r=all.map(a=>({a,s:scoreAero(a,qq,toks)+(fav.has(a.v)?3:0)})).filter(x=>x.s>0).sort((x,y)=>y.s-x.s).map(x=>x.a)}
 return r.slice(0,limit||40).map(a=>({v:a.v,s:a.n+(a.m?' · '+a.m:''),f:fav.has(a.v)}))}
function items(kind,q){q=(q||'').trim();
 if(kind==='air')return DB.aircraft.filter(a=>!q||nz(a.reg+' '+a.model).includes(nz(q))).map(a=>({v:a.reg,s:(a.model||'')+(a.eng==='multi'?' · multimotor':' · monomotor')}));
 if(kind==='pil'){const l=[{v:DB.owner||'',s:'propietario'}].filter(x=>x.v).concat(DB.pilots.map(p=>({v:p.name,s:p.role||''})));return l.filter(x=>!q||nz(x.v+' '+x.s).includes(nz(q)))}
 if(kind==='crew')return [{name:'Solo',role:'sin nadie más a bordo'},{name:'Acompañado',role:'2 personas a bordo'}].concat(DB.pilots).filter(p=>!q||nz(p.name+' '+p.role).includes(nz(q))).map(p=>({v:p.name,s:p.role||''}));
 {const r=aeroFind(q,DB.favs,DB.customAero,40);if(!r.some(x=>x.v==='ZZZZ')){const z={v:'ZZZZ',s:'Lugar no especificado · anota dónde en Observaciones'};if(q)r.push(z);else r.unshift(z)}return r}}

function refreshSearch(){if(S.tab!=='search')return;const sc=window.scrollY;const q=$('#q');const p=q?q.selectionStart:0;render();const n=$('#q');if(n){n.focus();n.setSelectionRange(p,p)}window.scrollTo(0,sc)}
async function restore(e){const file=e.target.files[0];if(!file)return;let d;try{d=JSON.parse(await file.text())}catch(x){toast('El archivo no es válido');return}
 if(!d||!Array.isArray(d.books)||!Array.isArray(d.flights)){toast('No parece una copia de este logbook');return}
 d.flights=d.flights.filter(f=>!f.club&&!String(f.id||'').startsWith('club_'));d.aircraft=(d.aircraft||[]).filter(a=>!a.club);
 const r=await ask('Restaurar copia','La copia tiene '+d.books.length+' logbooks y '+d.flights.length+' vuelos. ¿Cómo la aplico?',[{t:'Sustituir todo lo que hay ahora',v:'rep',cls:''},{t:'Combinar con lo que ya tengo',v:'mer'},{t:'Cancelar',v:null}]);
 if(!r)return;
 if(r==='rep'){const imp=DB.importadoLocal;DB=Object.assign(blank(),d);DB.importadoLocal=imp;applyTheme()}
 else{const mg=(k,key)=>{const s=new Set(DB[k].map(x=>x[key]));d[k].forEach(x=>{if(!s.has(x[key]))DB[k].push(x)})};mg('books','id');mg('flights','id');mg('aircraft','reg');mg('pilots','name');(d.favs||[]).forEach(x=>{if(!DB.favs.includes(x))DB.favs.push(x)});mg('customAero','code');if(!DB.owner)DB.owner=d.owner||''}
 save();rebuild();toast('Copia restaurada');S.screen='books';render()}

document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const act=b.dataset.a,v=b.dataset.v;
 switch(act){
 case'saveown':{const x=$('#own').value.trim();if(!x){toast('Escribe tu nombre');return}DB.owner=x;save();render();break}
 case'open':S.book=v;S.tab='flights';S.screen='book';render();window.scrollTo(0,0);break;
 case'back':if(S.screen==='settings'){if(dirty()){const r=await ask('Cambios sin guardar','Has cambiado cosas en Ajustes y no las has guardado.',[{t:'Guardar y salir',v:'s',cls:''},{t:'Salir sin guardar',v:'d'},{t:'Seguir editando',v:null}]);if(!r)return;if(r==='s'){commitSettings();return}}S.set=null;S.screen=S.prev==='book'?'book':'books'}else if(S.screen==='form'){S.screen='book';S.editing=false}else if(S.screen==='book')S.screen='books';else S.screen='books';render();window.scrollTo(0,0);break;
 case'settings':openSettings();break;
 case'setsave':commitSettings();break;
 case'ir-res':irReservas();break;case'ir-esc':irEscuela();break;
 case'logout':if(await ask('Cerrar sesión','Para volver a entrar necesitarás tu correo y contraseña.',[{t:'Cerrar sesión',v:true,cls:''},{t:'Cancelar',v:false}]))API.signOut();break;
 case'clubreset':{const base=BASES.get(S.f&&S.f.id);if(!base)break;const i=DB.flights.findIndex(x=>x.id===base.id);if(i>=0)DB.flights[i]=JSON.parse(JSON.stringify(base));save();rebuild();S.screen='book';S.editing=false;toast('Vuelo devuelto a los datos del club');render();break}
 case'implocal':{const d=viejoLocal();if(!d)break;const mg=(k,key)=>{const st=new Set((DB[k]||[]).map(x=>x[key]));(d[k]||[]).forEach(x=>{if(!st.has(x[key]))DB[k].push(x)})};
  const MAP={AG:'ULM AG',MAF:'ULM MAF',DGC:'ULM DGC',H:'ULM H'};(d.books||[]).forEach(b=>{if(MAP[b.type])b.type=MAP[b.type]});
  mg('books','id');mg('flights','id');mg('aircraft','reg');mg('pilots','name');(d.favs||[]).forEach(x=>{if(!DB.favs.includes(x))DB.favs.push(x)});mg('customAero','code');
  DB.importadoLocal=Date.now();save();rebuild();toast(d.flights.length+' vuelos pasados a la nube');render();break}
 case'nolocal':DB.importadoLocal=Date.now();save();render();break;
 case'delbook':{const bk=DB.books.find(x=>x.id===v);if(DB.flights.some(f=>f.club&&f.book===v)){toast('Este logbook tiene vuelos del club: no se puede borrar');return}const n=DB.flights.filter(f=>f.book===v).length;if(await ask('Borrar logbook','Se borrará «'+bk.name+'» y sus '+n+' vuelos. Haz antes una copia de seguridad.',[{t:'Borrar logbook',v:true,cls:'danger'},{t:'Cancelar',v:false}])){DB.books=DB.books.filter(x=>x.id!==v);DB.flights=DB.flights.filter(f=>f.book!==v);save();render()}break}
 case'man':S.showMan=true;render();break;
 case'acc':S.open[v]=!S.open[v];render();break;
 case'pbook':S.pbook=v;render();break;
 case'sprint':{const pb=DB.books.find(x=>x.id===S.pbook);if(!pb){toast('Elige un logbook');return}doPrint(pb,periodFlights(pb));break}
 case'scsv':{const pb=DB.books.find(x=>x.id===S.pbook);if(pb)csv(pb);break}
 case'sxlsx':{const pb=DB.books.find(x=>x.id===S.pbook);if(pb)xlsx(pb);break}
 case'newbook':S.nb='PPL';S.nbn='';S.screen='newbook';render();break;
 case'nbt':S.nb=v;S.nbn='';render();break;
 case'nbsave':{const n=$('#nbn').value.trim()||'Logbook '+S.nb;const o=$('#nbo').value.trim();const bk={id:uid(),type:S.nb,name:n,notes:o};DB.books.push(bk);save();S.book=bk.id;S.tab='flights';S.screen='book';render();break}
 case'tab':S.tab=v;render();window.scrollTo(0,0);break;
 case'addf':S.showMan=false;S.f=newFlight();S.editing=false;S.more=false;S.screen='form';render();window.scrollTo(0,0);break;
 case'editf':{const fx=DB.flights.find(f=>f.id===v);if(!fx)break;S.f=JSON.parse(JSON.stringify(fx))};S.showMan=!!S.f.man;S.editing=true;S.more=!!(S.f.ifr||S.f.night||S.f.me||S.f.multi||S.f.trM||S.f.dual||S.f.withInst||S.f.inst||S.f.fn==='DUAL');S.screen='form';render();window.scrollTo(0,0);break;
 case'savef':if(S.f&&S.f.club){const bs=BASES.get(S.f.id);if(bs){S.f.man=true;S.f.min=bs.min}}if(!S.editing&&esClubReg(S.f.reg)&&!await ask('Avión del club','Los vuelos en '+String(S.f.reg).toUpperCase()+' se añaden solos cuando los anotas en Volar. Anótalo aquí solo si es un vuelo anterior a la app.',[{t:'Guardar igualmente',v:true,cls:''},{t:'Cancelar',v:false}]))break;saveFlight();break;
 case'delf':if(S.f&&S.f.club)break;if(await ask('Borrar vuelo','Esta acción no se puede deshacer.',[{t:'Borrar',v:true,cls:'danger'},{t:'Cancelar',v:false}])){DB.flights=DB.flights.filter(f=>f.id!==S.f.id);save();S.screen='book';S.editing=false;render()}break;
  case'st':{const k=b.dataset.k;S.f[k]=Math.max(0,(+S.f[k]||0)+(+b.dataset.d));render();break}
 case'tg':S.f[b.dataset.k]=!S.f[b.dataset.k];render();break;
 case'more':S.more=!S.more;render();break;
 case'time':openTime(b.dataset.k);break;
 case'cbo':{const inp=document.querySelector('[data-f="'+b.dataset.k+'"]');inp.focus();showDD(inp,b.dataset.kind,true);break}
 case'qf':S.qf=v;render();break;
 case'qall':S.qall=!S.qall;render();break;
 case'per':S.per=v;render();break;
 case'fmt':S.fmt=v;render();break;
 case'print':doPrint(book(),periodFlights(book()));break;
 case'csv':csv();break;
 case'xlsx':xlsx();break;
 case'bkp':backup();break;
 case'rst':$('#rf').click();break;
 case'addpil':{const n=$('#pn').value.trim();if(!n){toast('Escribe el nombre');return}if(!S.set.pilots.some(x=>x.name===n))S.set.pilots.push({name:n,role:$('#pr').value.trim()});$('#pn').value='';$('#pr').value='';render();break}
 case'delpil':S.set.pilots.splice(+v,1);render();break;
 case'eng':S.eng=v;render();break;
 case'gtheme':S.set.theme=v;render();break;
 case'gmode':S.set.gauge.mode=v;render();break;
 case'gid':S.set.gauge.id=+v;S.set.gauge.mode='fixed';render();break;
 case'gtap':S.set.gauge.tap=v==='1';render();break;
 case'gcyc':{const g=DB.gauge||{};if(g.mode==='daily'){S.gOff=(S.gOff||0)+1}else{DB.gauge=Object.assign({},g,{mode:'fixed',id:(g.id||1)%11+1});S.gOff=0;save()}render();break}
 case'addair':{const r=$('#ar').value.toUpperCase().trim();if(!r){toast('Escribe la matrícula');return}if(S.set.aircraft.some(x=>x.reg===r)){toast('Ya está en la lista');return}S.set.aircraft.push({reg:r,model:$('#am').value.trim(),eng:S.eng==='multi'?'multi':'mono'});S.eng='mono';$('#ar').value='';$('#am').value='';render();break}
 case'delair':S.set.aircraft.splice(+v,1);render();break;
 case'fav':{const i=S.set.favs.indexOf(v);if(i>=0)S.set.favs.splice(i,1);else S.set.favs.push(v);const sc=window.scrollY;render();window.scrollTo(0,sc);break}
 case'addaero':{const c=$('#ac').value.toUpperCase().trim();if(!c){toast('Escribe el código');return}S.set.customAero.push({code:c,name:$('#an').value.trim()});if(!S.set.favs.includes(c))S.set.favs.push(c);$('#ac').value='';$('#an').value='';render();break}
 case'wipe':if(await ask('Borrar mis vuelos','Se borrarán tus logbooks, tus vuelos personales y tus ajustes. Los vuelos en aviones del club no se borran. Haz antes una copia.',[{t:'Borrar todo',v:true,cls:'danger'},{t:'Cancelar',v:false}])){const imp=DB.importadoLocal;DB=blank();DB.importadoLocal=imp||Date.now();applyTheme();save();rebuild();S.screen='books';render()}break;
 }});
let deferred=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;const i=$('#inst');if(i)i.innerHTML='<button class="btn" id="ib2">Instalar ahora</button>';const b=$('#ib2');if(b)b.onclick=()=>deferred.prompt()});
function migrar(){let ch=false;const MAP={AG:'ULM AG',MAF:'ULM MAF',DGC:'ULM DGC',H:'ULM H'};DB.books.forEach(b=>{if(MAP[b.type]){b.type=MAP[b.type];ch=true}});DB.flights.forEach(f=>{if(isFreeBook(f.book))return;const d=normPlace(f.dep),a=normPlace(f.arr);if(d!==f.dep){f.dep=d;ch=true}if(a!==f.arr){f.arr=a;ch=true}});return ch}
applyTheme();try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{if(DB.theme==='auto')applyTheme()})}catch(e){}
arrancar();
</script>
